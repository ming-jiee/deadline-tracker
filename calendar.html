<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar — Deadline Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero" style="padding-bottom: 30px;">
        <div class="topbar-inner" style="padding-top: 18px;">
            <a href="main.html" class="brand"><span class="brand-dot"></span>TheOne Deadline</a>
            <div class="nav-right">
                <a href="main.html" class="nav-link">Dashboard</a>
                <a href="calendar.html" class="nav-link active">Calendar</a>
                <a href="all-tasks.html" class="nav-link">All tasks</a>
                <div class="notif-wrap">
                    <button class="notif-bell" id="notifBell">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                    </button>
                    <div class="notif-dropdown" id="notifDropdown">
                        <div class="notif-dropdown-header">
                            <div class="notif-dropdown-title">Close deadlines</div>
                            <button class="notif-clear-btn" id="notifClearBtn">Clear all</button>
                        </div>
                        <div id="notifList"><div class="notif-empty">Loading...</div></div>
                    </div>
                </div>
                <a href="settings.html" class="avatar" id="avatarInitial" title="Account settings">S</a>
                <button id="logoutBtn" class="btn-text">Log out</button>
            </div>
        </div>
        <div class="hero-body" style="padding-bottom: 0;">
            <div class="eyebrow">Calendar</div>
            <h1 class="hero-title">See it laid out. <span class="soft">Every deadline, by date.</span></h1>
        </div>
    </div>

    <div class="container" style="margin-top: 24px;">
        <div class="layout" style="grid-template-columns: 1fr 320px;">
            <div class="card">
                <div class="cal-toolbar">
                    <div class="cal-nav">
                        <button class="cal-nav-btn" id="prevMonth">‹</button>
                        <div class="cal-month-label" id="monthLabel">—</div>
                        <button class="cal-nav-btn" id="nextMonth">›</button>
                    </div>
                    <button class="filter-item" id="todayBtn">Today</button>
                </div>
                <div class="cal-weekdays">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title" id="selectedDateLabel">Select a date</div>
                    <div id="selectedDateTasks">
                        <div class="empty-state" style="padding: 20px 0;">Click a date with a dot to see what's due.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="notifications.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
