<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Deadline Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-wrap">
        <div class="auth-brand"><span class="brand-dot"></span>TheOne Deadline</div>
        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your account</p>

            <form id="loginForm">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-primary">Log In</button>
            </form>
            <div class="status-msg" id="statusMsg"></div>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
